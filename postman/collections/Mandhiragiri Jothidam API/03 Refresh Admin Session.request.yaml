$kind: http-request
url: "{{baseUrl}}/auth/refresh"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "refreshToken": "{{adminRefreshToken}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Refresh token rotation succeeds', function () { pm.response.to.have.status(200); });
      pm.collectionVariables.set('adminToken', pm.response.json().data.token);
      pm.collectionVariables.set('adminRefreshToken', pm.response.json().data.refreshToken);
    language: text/javascript
order: 4000
