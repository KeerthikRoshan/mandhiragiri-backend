$kind: http-request
url: "{{baseUrl}}/bookings/{{bookingId}}/balance"
method: GET
headers:
  Authorization: Bearer {{adminToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Balance is returned', function () { pm.response.to.have.status(200); });
      pm.test('Initial client and priest balances are correct', function () { const f = pm.response.json().data.financials; pm.expect(f.clientBalanceAmount).to.eql(4000); pm.expect(f.priestBalanceAmount).to.eql(2000); });
    language: text/javascript
order: 9000
