$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "mobileNumber": "{{adminPhone}}",
      "password": "{{adminPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Admin login succeeds', function () { pm.response.to.have.status(200); });
      pm.collectionVariables.set('adminToken', pm.response.json().data.token);
      pm.collectionVariables.set('adminRefreshToken', pm.response.json().data.refreshToken);
    language: text/javascript
order: 2000
