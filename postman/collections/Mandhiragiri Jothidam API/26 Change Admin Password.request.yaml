$kind: http-request
url: "{{baseUrl}}/auth/change-password"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: text
  content: |-
    {
      "currentPassword": "{{adminPassword}}",
      "newPassword": "PostmanTest@1234"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Password can be changed', function () { pm.response.to.have.status(200); });
      pm.collectionVariables.set('adminPassword', 'PostmanTest@1234');
    language: text/javascript
order: 29000
