$kind: http-request
url: "{{baseUrl}}/reports/balances?fromDate={{today}}&toDate={{today}}"
method: GET
headers:
  Authorization: Bearer {{adminToken}}
scripts:
  - type: afterResponse
    code: pm.test('Balance report is returned', function () { pm.response.to.have.status(200); pm.expect(pm.response.json().data.bookingCount).to.be.greaterThan(0); });
    language: text/javascript
order: 14000
