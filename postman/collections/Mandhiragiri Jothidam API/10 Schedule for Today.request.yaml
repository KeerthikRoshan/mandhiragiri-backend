$kind: http-request
url: "{{baseUrl}}/schedule/bookings?date={{today}}&category=all&viewMode=time"
method: GET
headers:
  Authorization: Bearer {{adminToken}}
scripts:
  - type: afterResponse
    code: pm.test('Schedule is returned', function () { pm.response.to.have.status(200); pm.expect(pm.response.json().data.bookings.length).to.be.greaterThan(0); });
    language: text/javascript
order: 13000
