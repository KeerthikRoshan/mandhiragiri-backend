$kind: http-request
url: "{{baseUrl}}/bookings/{{bookingId}}/payments"
method: GET
headers:
  Authorization: Bearer {{adminToken}}
scripts:
  - type: afterResponse
    code: pm.test('Payment history has the recorded transaction', function () { pm.response.to.have.status(200); pm.expect(pm.response.json().data.payments.length).to.be.greaterThan(0); });
    language: text/javascript
order: 12000
