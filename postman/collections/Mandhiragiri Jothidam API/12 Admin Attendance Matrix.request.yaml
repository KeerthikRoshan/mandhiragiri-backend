$kind: http-request
url: "{{baseUrl}}/attendance/daily?date={{today}}&status=all&role=all"
method: GET
headers:
  Authorization: Bearer {{adminToken}}
scripts:
  - type: afterResponse
    code: pm.test('Attendance matrix is returned', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 15000
