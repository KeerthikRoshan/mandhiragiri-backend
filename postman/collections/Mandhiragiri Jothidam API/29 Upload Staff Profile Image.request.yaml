$kind: http-request
name: Upload Staff Profile Image
url: "{{baseUrl}}/admin/staff/{{staffId}}/image"
method: POST
headers:
  - key: Authorization
    value: "Bearer {{adminToken}}"
body:
  type: formdata
  content:
    - key: image
      type: file
      src: "{{staffImageFile}}"
      contentType: image/jpeg
scripts:
  - type: afterResponse
    code: |-
      pm.test('Staff profile image upload succeeds', function () {
        pm.response.to.have.status(200);
        const body = pm.response.json();
        pm.expect(body.data.imageUrl).to.match(/^\/uploads\/staff\//);
      });
    language: text/javascript
order: 29000
