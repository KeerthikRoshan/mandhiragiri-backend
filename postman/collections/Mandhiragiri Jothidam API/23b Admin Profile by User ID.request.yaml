$kind: http-request
url: "{{baseUrl}}/admin/profile/:user_id"
method: GET
pathVariables:
  - key: user_id
    value: "1"
headers:
  Authorization: Bearer {{adminToken}}
scripts:
  - type: afterResponse
    code: pm.test('Admin profile by user ID is returned', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 26500
